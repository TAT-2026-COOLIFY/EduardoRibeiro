services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: printhub
      MYSQL_USER: printhub
      MYSQL_PASSWORD: ${DB_PASSWORD:-printhub_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-printhub_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: printhub-back/Dockerfile
    env_file:
      - path: printhub-back/.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://cfrc5vv8cxkeamxic264hhdz.187.33.201.107.sslip.io}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: printhub
      DB_USERNAME: printhub
      DB_PASSWORD: ${DB_PASSWORD:-printhub_local}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./printhub-back:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  backend-nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./printhub-back:/var/www/html:ro
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: printhub-front/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend-nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  backend_vendor:
  backend_storage:
